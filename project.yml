name: CampusTask

options:
  bundleIdPrefix: com.milton
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  CampusTask:
    type: application
    platform: iOS
    sources:
      - path: CampusTask
        excludes:
          - Resources
    resources:
      - path: CampusTask/Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milton.campustask
        PRODUCT_NAME: CampusTask
        INFOPLIST_FILE: CampusTask/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

schemes:
  CampusTask:
    build:
      targets:
        CampusTask: all
    run:
      config: Debug
    archive:
      config: Release
